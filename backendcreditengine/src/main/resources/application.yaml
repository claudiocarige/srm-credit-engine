spring:
  application:
    name: backendcreditengine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/srm_credit_engine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

srm:
  pricing:
    base-rate-monthly: "0.010000"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    url: /openapi/srm-credit-engine.yaml
    disable-swagger-default-url: true
